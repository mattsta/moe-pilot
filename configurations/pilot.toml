schema_version = 1

[paths]
model = "../models/olmoe"
data = "../data/pilot"
output = "../runs/pilot"

[model]
repository = "allenai/OLMoE-1B-7B-0924"
# Set the exact model commit SHA before running download-model.
revision = ""

[execution]
device = "auto"
threads = 2
max_tokens = 64
condition_group = 1
weight_cache = "stream"
max_memory_gib = 8
reserve_memory_gib = 16

[analysis]
seed = 0
permutations = 20
bootstrap_samples = 2000
probe_tokens_per_domain = 100
layers = [0, 7, 15]

[ablations]
expert_counts = [1, 4, 8]
control_seeds = 3
control_candidates = 4000
on_domain_candidates = 6000

[corpora]
analysis_count = 100
heldout_count = 40
subtopic_count = 60

# To rebuild corpora, add immutable repository commit SHAs in this table.
# Reusing the archived sampled JSON files does not require dataset downloads.
[datasets]
