[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "moe-pilot"
version = "0.1.0"
description = "CPU layer-streaming OLMoE research workflows and reproducible expert-specialization experiments"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "huggingface-hub>=0.28,<3",
    "matplotlib>=3.9,<4",
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "safetensors>=0.5,<1",
    "torch>=2.6,<3",
    "transformers>=4.48,<6",
]

[project.optional-dependencies]
data = ["datasets>=3.2,<6"]

[project.scripts]
moe-pilot = "moe_pilot.cli:main"

[dependency-groups]
dev = ["build>=1.2,<2", "pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/moe_pilot"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/", "README.md", "CONTRIBUTING.md", "pyproject.toml", "uv.lock", ".python-version"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["E741"]
