[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "moe-pilot"
version = "0.1.0"
description = "Device-aware OLMoE research workflows and reproducible expert-specialization experiments"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "filelock>=3.16,<5",
    "huggingface-hub>=0.28,<3",
    "matplotlib>=3.9,<4",
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "safetensors>=0.5,<1",
    "torch>=2.6,<3",
    "transformers>=5.20,<6",
]

[project.optional-dependencies]
data = ["datasets>=3.2,<6"]
cpu = ["torch>=2.6,<3; sys_platform == 'linux'"]
rocm = [
    "torch>=2.6,<3; sys_platform == 'linux'",
    "pytorch-triton-rocm>=3.5.1; sys_platform == 'linux'",
    "triton-rocm>=3.6.0; sys_platform == 'linux'",
]

[project.scripts]
moe-pilot = "moe_pilot.cli:main"

[dependency-groups]
dev = ["build>=1.2,<2", "pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/moe_pilot"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/", "configurations/", "README.md", "CONTRIBUTING.md", "pyproject.toml", "uv.lock", ".python-version"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "rocm" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux'" },
]
pytorch-triton-rocm = [{ index = "pytorch-rocm" }]
triton-rocm = [{ index = "pytorch-rocm" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["E741"]
